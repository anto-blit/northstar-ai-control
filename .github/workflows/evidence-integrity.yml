name: Evidence integrity replay
on:
  push:
    paths:
      - 'experiments/evidence-integrity/**'
      - 'results/evidence-integrity/**'
      - '.github/workflows/evidence-integrity.yml'
  pull_request:
    paths:
      - 'experiments/evidence-integrity/**'
      - 'results/evidence-integrity/**'
      - '.github/workflows/evidence-integrity.yml'
jobs:
  replay:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s experiments/evidence-integrity -p test_run.py
      - name: Replay saved results when complete
        shell: bash
        run: |
          if [ -f results/evidence-integrity/report.json ]; then
            python experiments/evidence-integrity/run.py verify
          fi
