name: Verify NorthStar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check dashboard against recorded evidence
        run: python dashboard/build_dashboard.py --check
      - name: Check dashboard integrity and risk separation
        run: python -m unittest discover -s dashboard -p test_dashboard.py -v
      - name: Verify preserved guidance results without model calls
        run: |
          python -m unittest discover -s experiments/guidance-pilot -p test_pilot.py -v
          python experiments/guidance-pilot/pilot.py verify
          python experiments/guidance-pilot/diagnose.py
          python -m unittest discover -s experiments/guidance-development -p test_verify.py -v
          python experiments/guidance-development/verify.py
          python -m unittest discover -s experiments/decision-repair -p test_run.py -v
          python experiments/decision-repair/run.py verify
          python -m unittest discover -s experiments/repair-replication -p test_run.py -v
          python experiments/repair-replication/run.py verify
          python -m unittest discover -s experiments/repair-continuation -p test_run.py -v
          python experiments/repair-continuation/run.py verify
          python -m unittest discover -s experiments/codex-repair -p test_run.py -v
          python experiments/codex-repair/run.py verify
          python -m unittest discover -s experiments/story-distillation -p test_run.py -v
          python experiments/story-distillation/run.py verify
          python -m unittest discover -s experiments/story-continuation -p test_run.py -v
          python experiments/story-continuation/run.py verify
          python -m unittest discover -s experiments/revocation-agent -p test_run.py -v
          python experiments/revocation-agent/run.py verify
      - name: Run conformance and regression checks
        run: python verify_project.py
      - name: Reproduce frozen discovery trials
        run: python study.py discover results/study-feasibility/manifest.json experiments/discovery-study/example/scripted-submissions.json study-runs/ci/discovery.json
      - name: Reproduce frozen paired challenges
        run: python study.py replay results/study-feasibility/manifest.json experiments/discovery-study/example/challenges.json study-runs/ci/replay.json
