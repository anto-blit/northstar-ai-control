name: Verify NorthStar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check dashboard against recorded evidence
        run: python dashboard/build_dashboard.py --check
      - name: Check dashboard integrity and risk separation
        run: python -m unittest discover -s dashboard -p test_dashboard.py -v
      - name: Verify preserved guidance results without model calls
        run: |
          python experiments/known-approval-replay/replay.py verify
          python -m unittest discover -s experiments/guidance-pilot -p test_pilot.py -v
          python experiments/guidance-pilot/pilot.py verify
          python experiments/guidance-pilot/diagnose.py
          python -m unittest discover -s experiments/guidance-development -p test_verify.py -v
          python experiments/guidance-development/verify.py
          python -m unittest discover -s experiments/decision-repair -p test_run.py -v
          python experiments/decision-repair/run.py verify
          python -m unittest discover -s experiments/repair-replication -p test_run.py -v
          python experiments/repair-replication/run.py verify
          python -m unittest discover -s experiments/repair-continuation -p test_run.py -v
          python experiments/repair-continuation/run.py verify
          python -m unittest discover -s experiments/codex-repair -p test_run.py -v
          python experiments/codex-repair/run.py verify
          python -m unittest discover -s experiments/story-distillation -p test_run.py -v
          python experiments/story-distillation/run.py verify
          python -m unittest discover -s experiments/story-continuation -p test_run.py -v
          python experiments/story-continuation/run.py verify
          python -m unittest discover -s experiments/revocation-agent -p test_run.py -v
          python experiments/revocation-agent/run.py verify
      - name: Check narrow approval screen
        run: python -m unittest discover -s experiments/approval-story-screen -p test_run.py
      - name: Check corrected comparison machinery without provider calls
        run: python -m unittest discover -s experiments/deliberation-comparison-v2 -p test_run.py -v
      - name: Check fallback action framework without provider calls
        run: |
          python -m unittest discover -s experiments/fallback-actions -p test_run.py -v
          python experiments/fallback-actions/run.py check experiments/fallback-actions/draft-plan.json
      - name: Check side-gate parable screen without provider calls
        run: python -m unittest discover -s experiments/side-gate-screen -p test_run.py -v
      - name: Check three-parable screen and preserve infrastructure failure
        run: |
          python -m unittest discover -s experiments/three-parable-screen-v2 -p test_run.py -v
          python experiments/three-parable-screen/run.py verify results/three-parable-screen-TPS1
          python experiments/three-parable-screen-v2/run.py verify results/three-parable-screen-TPS2
      - name: Check reporting-failure reproduction without provider calls
        run: |
          python -m unittest discover -s experiments/mislabel-confirmation -p test_run.py -v
          python -m unittest discover -s experiments/mislabel-minimal -p test_run.py -v
          python experiments/mislabel-confirmation/run.py verify results/mislabel-confirmation-MCF1
          python experiments/mislabel-minimal/run.py verify results/mislabel-minimal-MMS1
          python reproducers/mislabel-v1/audit.py verify
      - name: Check interchangeable parable preparation without provider calls
        run: |
          python -m unittest discover -s experiments/parable-screen -p test_run.py -v
          python experiments/parable-screen/run.py check results/parable-screen/draft-plan.json
      - name: Reproduce scientific sensitivity review without provider calls
        run: |
          python -m unittest discover -s experiments/parable-screen-review -p test_review.py -v
          python experiments/parable-screen-review/review.py verify
      - name: Preserve the original G17 preflight evidence
        run: python experiments/deliberation-preflight/check.py --verify results/deliberation-preflight/report.json
      - name: Replay narrow approval screen when recorded
        if: ${{ hashFiles('results/approval-story-screen/report.json') != '' }}
        run: python experiments/approval-story-screen/run.py verify
      - name: Replay the complete approval repeatability run
        # Recompute the recurrence result without new provider calls.
        run: python experiments/approval-repeatability/run.py verify
      - name: Check story micro scoring and adaptation
        run: python -m unittest discover -s experiments/story-micro -p test_run.py
      - name: Replay story micro rounds when recorded
        if: ${{ hashFiles('results/story-micro/report.json') != '' }}
        run: python experiments/story-micro/run.py verify
      - name: Check candidate lesson contracts without model calls
        # Candidate checks do not alter frozen studies.
        run: python -m unittest discover -s curriculum/candidates -p test_candidates.py
      - name: Check keeper micro scoring and isolation
        run: python -m unittest discover -s experiments/keeper-micro -p test_run.py
      - name: Check bounded Codex baseline search
        run: python -m unittest discover -s experiments/codex-failure-search -p test_run.py
      - name: Check exact recipient identity baseline
        run: python -m unittest discover -s experiments/codex-identity-check -p test_run.py
      - name: Replay exact recipient identity checks when recorded
        if: ${{ hashFiles('results/codex-identity-check/report.json') != '' }}
        run: python experiments/codex-identity-check/run.py verify
      - name: Replay bounded Codex baseline search when recorded
        if: ${{ hashFiles('results/codex-failure-search/report.json') != '' }}
        run: python experiments/codex-failure-search/run.py verify
      - name: Replay keeper micro screen when recorded
        if: ${{ hashFiles('results/keeper-micro/report.json') != '' }}
        run: python experiments/keeper-micro/run.py verify
      - name: Check frozen-story confirmation scoring
        run: python -m unittest discover -s experiments/story-confirmation -p test_run.py
      - name: Replay story confirmation when recorded
        if: ${{ hashFiles('results/story-confirmation/report.json') != '' }}
        run: python experiments/story-confirmation/run.py verify
      - name: Check amended confirmation inventory and scoring
        run: python -m unittest discover -s experiments/story-confirmation-v2 -p test_run.py
      - name: Replay amended story confirmation when recorded
        if: ${{ hashFiles('results/story-confirmation-v2/report.json') != '' }}
        run: python experiments/story-confirmation-v2/run.py verify
      - name: Check complete confirmation packet and unchanged targets
        run: python -m unittest discover -s experiments/story-confirmation-v3 -p test_run.py
      - name: Replay confirmation with completed dependency packet when recorded
        if: ${{ hashFiles('results/story-confirmation-v3/report.json') != '' }}
        run: python experiments/story-confirmation-v3/run.py verify
      - name: Run conformance and regression checks
        run: python verify_project.py
      - name: Reproduce frozen discovery trials
        run: python study.py discover results/study-feasibility/manifest.json experiments/discovery-study/example/scripted-submissions.json study-runs/ci/discovery.json
      - name: Reproduce frozen paired challenges
        run: python study.py replay results/study-feasibility/manifest.json experiments/discovery-study/example/challenges.json study-runs/ci/replay.json
