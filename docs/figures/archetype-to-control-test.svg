<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
<title id="title">From causal hypothesis to independently challenged repair</title>
<desc id="desc">Six stages: hypothesis, executable test, benign twin, observed effect, repair, and fresh challenge. The primary goal is improved prevention with legitimate usefulness.</desc>
<defs></defs>
<rect width="1600" height="680" fill="#f6f4ee"/>
<path d="M68 40 L71.04 52.96 L84 56 L71.04 59.04 L68 72 L64.96 59.04 L52 56 L64.96 52.96 Z" fill="#087f79"/>
<text x="102" y="64" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="3">FROM DISCOVERY TO PREVENTION</text>
<text x="52" y="133" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="45" font-weight="700" fill="#102d3b" text-anchor="start" letter-spacing="0">A good story is only the beginning.</text>
<text x="54" y="178" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">The goal is a safeguard that survives a fresh challenge and still lets people do useful work.</text>
<rect x="52" y="253" width="234" height="219" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<circle cx="87" cy="291" r="17" fill="#e0efea" stroke="none" stroke-width="2"/>
<text x="87" y="297" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#087f79" text-anchor="middle" letter-spacing="0">01</text>
<text x="72" y="342" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">HYPOTHESIS</text>
<text x="72" y="386" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Identify a causal</text>
<text x="72" y="416" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">failure pattern.</text>
<path d="M287 364H299" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M294 359L299 364L294 369" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="303" y="253" width="234" height="219" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<circle cx="338" cy="291" r="17" fill="#e0efea" stroke="none" stroke-width="2"/>
<text x="338" y="297" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#087f79" text-anchor="middle" letter-spacing="0">02</text>
<text x="323" y="342" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">EXECUTABLE TEST</text>
<text x="323" y="386" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Make the failure</text>
<text x="323" y="416" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">happen in simulation.</text>
<path d="M538 364H550" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M545 359L550 364L545 369" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="554" y="253" width="234" height="219" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<circle cx="589" cy="291" r="17" fill="#e0efea" stroke="none" stroke-width="2"/>
<text x="589" y="297" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#087f79" text-anchor="middle" letter-spacing="0">03</text>
<text x="574" y="342" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">BENIGN TWIN</text>
<text x="574" y="386" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Change the decisive</text>
<text x="574" y="416" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">fact. Keep the task.</text>
<path d="M789 364H801" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M796 359L801 364L796 369" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="805" y="253" width="234" height="219" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<circle cx="840" cy="291" r="17" fill="#e0efea" stroke="none" stroke-width="2"/>
<text x="840" y="297" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#087f79" text-anchor="middle" letter-spacing="0">04</text>
<text x="825" y="342" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">OBSERVED EFFECT</text>
<text x="825" y="386" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Score the episode</text>
<text x="825" y="416" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">and pending work.</text>
<path d="M1040 364H1052" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M1047 359L1052 364L1047 369" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="1056" y="253" width="234" height="219" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<circle cx="1091" cy="291" r="17" fill="#e0efea" stroke="none" stroke-width="2"/>
<text x="1091" y="297" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#087f79" text-anchor="middle" letter-spacing="0">05</text>
<text x="1076" y="342" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">REPAIR</text>
<text x="1076" y="386" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Enforce the missing</text>
<text x="1076" y="416" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">boundary.</text>
<path d="M1291 364H1303" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M1298 359L1303 364L1298 369" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="1307" y="253" width="234" height="219" rx="14" fill="#102f3d" stroke="#d9e2dc"/>
<circle cx="1342" cy="291" r="17" fill="#254e57" stroke="none" stroke-width="2"/>
<text x="1342" y="297" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#b5ebd9" text-anchor="middle" letter-spacing="0">06</text>
<text x="1327" y="342" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#b5ebd9" text-anchor="start" letter-spacing="0">FRESH CHALLENGE</text>
<text x="1327" y="386" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#f6f4ee" text-anchor="start" letter-spacing="0">Try unfamiliar cases</text>
<text x="1327" y="416" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#f6f4ee" text-anchor="start" letter-spacing="0">and adaptive attacks.</text>
<rect x="52" y="510" width="1489" height="75" rx="10" fill="#e4eee6" stroke="none"/>
<text x="81" y="555" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="1">THE BAR:</text>
<text x="195" y="555" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Better prevention at useful capability — compared with strong conventional methods.</text>
<path d="M54 618 H1546" fill="none" stroke="#d7dfda" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<text x="54" y="652" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="1">NORTHSTAR  /  CALIBRATED VISION</text>
<text x="1546" y="652" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="end" letter-spacing="0">The full comparative discovery-to-prevention study remains to be run</text>
</svg>
