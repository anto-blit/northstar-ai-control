<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="705" viewBox="0 0 1600 705" role="img" aria-labelledby="title desc">
<title id="title">Intervene before a prohibited irreversible commit</title>
<desc id="desc">A timeline shows a reviewable stage, review and revalidation, the committing boundary, and persistent history. Later shutdown does not erase a prohibited release.</desc>
<defs></defs>
<rect width="1600" height="705" fill="#f6f4ee"/>
<path d="M68 40 L71.04 52.96 L84 56 L71.04 59.04 L68 72 L64.96 59.04 L52 56 L64.96 52.96 Z" fill="#087f79"/>
<text x="102" y="64" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="3">WHY INTERVENTION TIMING MATTERS</text>
<text x="52" y="133" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="45" font-weight="700" fill="#102d3b" text-anchor="start" letter-spacing="0">A warning after release is already too late.</text>
<text x="54" y="178" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">For a prohibited non-recallable effect, prevention must happen before the committing action.</text>
<rect x="52" y="233" width="960" height="275" rx="16" fill="#e4eee6" stroke="none"/>
<rect x="1034" y="233" width="514" height="275" rx="16" fill="#f3e3d6" stroke="none"/>
<text x="80" y="275" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="1">THE INTERVENTION WINDOW</text>
<text x="1062" y="275" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#c5673a" text-anchor="start" letter-spacing="1">COMMITTED HISTORY</text>
<path d="M120 353H1468" fill="none" stroke="#55717b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M1460 346L1468 353L1460 360" fill="none" stroke="#55717b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<circle cx="190" cy="353" r="22" fill="#f6f4ee" stroke="#087f79" stroke-width="3"/>
<circle cx="190" cy="353" r="7" fill="#087f79" stroke="none" stroke-width="2"/>
<text x="190" y="421" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#102d3b" text-anchor="middle" letter-spacing="0">Stage</text>
<text x="190" y="458" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#55717b" text-anchor="middle" letter-spacing="0">Inspect the proposed effect.</text>
<circle cx="573" cy="353" r="22" fill="#f6f4ee" stroke="#087f79" stroke-width="3"/>
<circle cx="573" cy="353" r="7" fill="#087f79" stroke="none" stroke-width="2"/>
<text x="573" y="421" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#102d3b" text-anchor="middle" letter-spacing="0">Review + revalidate</text>
<text x="573" y="458" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#55717b" text-anchor="middle" letter-spacing="0">Check current authority.</text>
<circle cx="1023" cy="353" r="22" fill="#f6f4ee" stroke="#c5673a" stroke-width="3"/>
<circle cx="1023" cy="353" r="7" fill="#c5673a" stroke="none" stroke-width="2"/>
<text x="1023" y="421" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#c5673a" text-anchor="middle" letter-spacing="0">Commit</text>
<text x="1023" y="458" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#55717b" text-anchor="middle" letter-spacing="0">The boundary is crossed.</text>
<circle cx="1430" cy="353" r="22" fill="#f6f4ee" stroke="#087f79" stroke-width="3"/>
<circle cx="1430" cy="353" r="7" fill="#087f79" stroke="none" stroke-width="2"/>
<text x="1430" y="421" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#102d3b" text-anchor="middle" letter-spacing="0">Record</text>
<text x="1430" y="458" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#55717b" text-anchor="middle" letter-spacing="0">The effect remains.</text>
<path d="M1023 214V327 M1023 379V389 M1023 480V528" fill="none" stroke="#c5673a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<text x="82" y="565" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="25" font-weight="600" fill="#087f79" text-anchor="start" letter-spacing="0">Stop, revoke, or hold while intervention can still work.</text>
<text x="82" y="607" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#102d3b" text-anchor="start" letter-spacing="0">Score the whole episode. A later shutdown cannot erase a prohibited release.</text>
<path d="M54 643 H1546" fill="none" stroke="#d7dfda" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<text x="54" y="677" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="1">NORTHSTAR  /  CALIBRATED VISION</text>
<text x="1546" y="677" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="end" letter-spacing="0">An authorized irreversible action is not automatically a failure</text>
</svg>
