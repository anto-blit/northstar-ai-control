<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Five archetypes, five testable mechanisms</title>
<desc id="desc">Camel&#x27;s nose: cumulative authority. Trojan horse: hidden effects. Faust: deferred commitments. Pandora: irreversible release. Sorcerer&#x27;s apprentice: work continuing after stop.</desc>
<defs></defs>
<rect width="1600" height="700" fill="#f6f4ee"/>
<path d="M68 40 L71.04 52.96 L84 56 L71.04 59.04 L68 72 L64.96 59.04 L52 56 L64.96 52.96 Z" fill="#087f79"/>
<text x="102" y="64" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="3">THE SEARCH HYPOTHESIS</text>
<text x="52" y="133" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="45" font-weight="700" fill="#102d3b" text-anchor="start" letter-spacing="0">Old warnings. Testable failure mechanisms.</text>
<text x="54" y="178" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">Five story patterns suggest where to look. Experiments decide whether the safeguards hold.</text>
<rect x="52" y="225" width="284" height="386" rx="18" fill="#ffffff" stroke="#d9e2dc"/>
<text x="74" y="260" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="2">01</text>
<g transform="translate(113,278)"><path d="M10 86H42V66H74V44H106V20H133" fill="none" stroke="#087f79" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M121 20H133V32" fill="none" stroke="#087f79" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></g>
<text x="74" y="441" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">Camel&#x27;s nose</text>
<text x="74" y="478" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">Small permissions.</text>
<text x="74" y="507" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">Growing authority.</text>
<text x="74" y="551" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">Track what permissions</text>
<text x="74" y="576" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">can do together.</text>
<rect x="354" y="225" width="284" height="386" rx="18" fill="#ffffff" stroke="#d9e2dc"/>
<text x="376" y="260" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="2">02</text>
<g transform="translate(415,278)"><path d="M25 40L75 16L125 40V93L75 117L25 93Z M25 40L75 65L125 40 M75 65V117" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><circle cx="103" cy="87" r="16" fill="#f5d7c4" stroke="none" stroke-width="2"/><path d="M103 77 L104.9 85.1 L113 87 L104.9 88.9 L103 97 L101.1 88.9 L93 87 L101.1 85.1 Z" fill="#c5673a"/></g>
<text x="376" y="441" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">Trojan horse</text>
<text x="376" y="478" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">Useful function.</text>
<text x="376" y="507" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">Hidden effect.</text>
<text x="376" y="551" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">Inspect what a component</text>
<text x="376" y="576" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">can actually change.</text>
<rect x="656" y="225" width="284" height="386" rx="18" fill="#ffffff" stroke="#d9e2dc"/>
<text x="678" y="260" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="2">03</text>
<g transform="translate(717,278)"><circle cx="66" cy="59" r="42" fill="none" stroke="#087f79" stroke-width="3"/><path d="M66 32V59L89 72" fill="none" stroke="#087f79" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M103 89H133 M125 81L133 89L125 97" fill="none" stroke="#c5673a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></g>
<text x="678" y="441" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">Faust</text>
<text x="678" y="478" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">Success today.</text>
<text x="678" y="507" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">An obligation later.</text>
<text x="678" y="551" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">Follow queued commitments</text>
<text x="678" y="576" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">beyond the checkpoint.</text>
<rect x="958" y="225" width="284" height="386" rx="18" fill="#ffffff" stroke="#d9e2dc"/>
<text x="980" y="260" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="2">04</text>
<g transform="translate(1019,278)"><path d="M20 61L73 84L126 61 M20 61V102L73 126L126 102V61 M73 84V125 M24 52L57 25L99 44" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M103 26L127 8 M114 8H127V21" fill="none" stroke="#c5673a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></g>
<text x="980" y="441" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">Pandora</text>
<text x="980" y="478" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">One action.</text>
<text x="980" y="507" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">No taking it back.</text>
<text x="980" y="551" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">Check authority before</text>
<text x="980" y="576" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">the irreversible commit.</text>
<rect x="1260" y="225" width="284" height="386" rx="18" fill="#ffffff" stroke="#d9e2dc"/>
<text x="1282" y="260" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="2">05</text>
<g transform="translate(1321,278)"><path d="M74 26V55 M27 83V55H122V83" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><circle cx="74" cy="19" r="12" fill="#f3d7c6" stroke="#c5673a" stroke-width="2"/><circle cx="27" cy="96" r="13" fill="#d9efdf" stroke="#087f79" stroke-width="2"/><circle cx="122" cy="96" r="13" fill="#d9efdf" stroke="#087f79" stroke-width="2"/><path d="M69 19H79" fill="none" stroke="#c5673a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></g>
<text x="1282" y="441" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">Sorcerer&#x27;s apprentice</text>
<text x="1282" y="478" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">The parent stops.</text>
<text x="1282" y="507" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="650" fill="#102d3b" text-anchor="start" letter-spacing="0">The work continues.</text>
<text x="1282" y="551" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">Revoke the authority</text>
<text x="1282" y="576" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">of every descendant.</text>
<path d="M54 638 H1546" fill="none" stroke="#d7dfda" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<text x="54" y="672" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="1">NORTHSTAR  /  CALIBRATED VISION</text>
<text x="1546" y="672" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="end" letter-spacing="0">Hypotheses to investigate — not proof of an advantage</text>
</svg>
