<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="695" viewBox="0 0 1600 695" role="img" aria-labelledby="title desc">
<title id="title">Execution authority stays outside the untrusted agent</title>
<desc id="desc">Independent human authority and a fallible monitor feed an effect broker. The broker checks proposed actions, records state and ledger together, and mediates effects. Deferred work returns through the same broker.</desc>
<defs></defs>
<rect width="1600" height="695" fill="#f6f4ee"/>
<path d="M68 40 L71.04 52.96 L84 56 L71.04 59.04 L68 72 L64.96 59.04 L52 56 L64.96 52.96 Z" fill="#087f79"/>
<text x="102" y="64" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="3">THE PROPOSED CONTROL BOUNDARY</text>
<text x="52" y="133" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="45" font-weight="700" fill="#102d3b" text-anchor="start" letter-spacing="0">The agent proposes. The broker controls effects.</text>
<text x="54" y="178" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="24" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">Hard constraints, current authority, and intervention powers must hold even under deliberate subversion.</text>
<rect x="490" y="220" width="376" height="66" rx="18" fill="#dfede5" stroke="none"/>
<text x="678" y="248" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#087f79" text-anchor="middle" letter-spacing="0">INDEPENDENT HUMAN AUTHORITY</text>
<text x="678" y="273" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#102d3b" text-anchor="middle" letter-spacing="0">Stop / revoke scope</text>
<path d="M678 287V324" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M671 317L678 324L685 317" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="910" y="220" width="356" height="66" rx="18" fill="#ece8df" stroke="none"/>
<text x="1088" y="248" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#55717b" text-anchor="middle" letter-spacing="0">FALLIBLE MONITOR</text>
<text x="1088" y="273" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#102d3b" text-anchor="middle" letter-spacing="0">A verdict cannot override hard checks</text>
<path d="M947 287L867 323" fill="none" stroke="#55717b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/>
<rect x="52" y="320" width="292" height="144" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<text x="74" y="354" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">UNTRUSTED AGENT</text>
<text x="74" y="399" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Proposes actions</text>
<text x="74" y="433" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">May try to defeat safeguards</text>
<rect x="408" y="320" width="502" height="144" rx="14" fill="#102f3d" stroke="#d9e2dc"/>
<text x="430" y="354" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#9fe0cc" text-anchor="start" letter-spacing="0">EFFECT BROKER</text>
<text x="430" y="399" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#f6f4ee" text-anchor="start" letter-spacing="0">Check scope + shared state</text>
<text x="430" y="433" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#c0d7d6" text-anchor="start" letter-spacing="0">Revalidate before committing</text>
<rect x="974" y="320" width="245" height="144" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<text x="996" y="354" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">STATE + LEDGER</text>
<text x="996" y="399" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Record the transition</text>
<text x="996" y="433" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">and its receipt together</text>
<rect x="1283" y="320" width="265" height="144" rx="14" fill="#ffffff" stroke="#d9e2dc"/>
<text x="1305" y="354" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#087f79" text-anchor="start" letter-spacing="0">SIMULATED EFFECT</text>
<text x="1305" y="399" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="21" font-weight="600" fill="#102d3b" text-anchor="start" letter-spacing="0">Release or dispatch</text>
<text x="1305" y="433" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="start" letter-spacing="0">inside the declared model</text>
<path d="M345 392H405" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M397 385L405 392L397 399" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M912 392H971" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M963 385L971 392L963 399" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M1221 392H1280" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M1272 385L1280 392L1272 399" fill="none" stroke="#087f79" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<path d="M503 465V512" fill="none" stroke="#c5673a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="407" y="512" width="193" height="48" rx="9" fill="#f5e2d5" stroke="none"/>
<text x="503" y="542" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#c5673a" text-anchor="middle" letter-spacing="0">HOLD / REJECT</text>
<path d="M1414 465V572H753V466" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7"/>
<path d="M746 473L753 466L760 473" fill="none" stroke="#087f79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<rect x="880" y="550" width="450" height="44" rx="0" fill="#f6f4ee" stroke="none"/>
<text x="1105" y="578" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="20" font-weight="600" fill="#087f79" text-anchor="middle" letter-spacing="0">Queued work returns through the broker</text>
<path d="M54 633 H1546" fill="none" stroke="#d7dfda" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/>
<text x="54" y="667" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="15" font-weight="600" fill="#55717b" text-anchor="start" letter-spacing="1">NORTHSTAR  /  CALIBRATED VISION</text>
<text x="1546" y="667" font-family="Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#55717b" text-anchor="end" letter-spacing="0">Specified architecture; full isolation and enforcement boundary not yet validated</text>
</svg>
